<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style></style>
  </head>
  <body>
    <div class="content">
      <img
        src="https://11labs-nonprd-15f22c1d.s3.eu-west-3.amazonaws.com/0b9cd3e1-9fad-4a5b-b3a0-c96b0a1f1d2b/elevenlabs-logo-black.svg"
        alt="Eleven Labs Logo"
      />
    </div>
    <form class="signup-card">
      <p>Create an account</p>
      <button type="button" class="google-btn">
        <img
          src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"
          alt="Google Logo"
        />
        <span>Sign up with Google</span>
      </button>

      <!-- email -->
      <label for="email"> Email</label>
      <input type="email" id="email" name="email" />

      <!-- password -->
      <div class="input-password">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" name="password" id="password" />
          <button type="button" class="toggle-password">
            <ion-icon name="eye-outline"></ion-icon>
          </button>
        </div>
      </div>

      <!-- submit -->
      <button type="submit">Sign Up</button>
      <p>Already registered? <a href="#">Sign in</a></p>
    </form>
    <footer>
      By continuing, you agree to <a href="#">Terms of Service</a> and
      <a href="#">Privacy Policy</a>
    </footer>
  </body>
  <script
    type="module"
    src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
  ></script>
  <script
    nomodule
    src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
  ></script>
</html>
