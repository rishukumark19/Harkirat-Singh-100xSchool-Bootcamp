<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup ElevenLabs</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- header  -->
    <header class="header">IIElevenLabs</header>
    <main class="content">
      <!-- hero  -->
      <form action="#" method="post">
        <div class="hero">
          <div class="head">Create an account</div>
          <div class="google-signup">
            <span>
              <img
                src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"
                alt="Google Logo"
            /></span>
            <span class="text-inside-box">Sign up with Google</span>
          </div>
          <div class="line"></div>

          <!-- EMAIL  -->
          <label for="email">Email</label>

          <span class="email-input-box"
            ><input type="email" id="email" name="email"
          /></span>

          <!-- Password  -->
          <label for="password">Password </label>
          <span class="password-input-box"
            ><input type="password" id="password" name="password"
          /></span>

          <div class="btn-primary" type="submit">Sign up</div>
          <div class="below-button">
            <span>
              Already registered?
              <a href="#">Sign in</a>
            </span>
          </div>
        </div>
      </form>
    </main>
    <!-- footer  -->
    <footer class="footer">
      <span
        >By continuing, you agree to our <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>.</span
      >
    </footer>
  </body>
</html>
