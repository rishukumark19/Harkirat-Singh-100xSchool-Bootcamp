<html>
  <head>
    <!--Meta data: not the part of website-->
    <title>portfolio</title>
    <!--lets u add text on the bar -->
  </head>
  <body>
    <h1>My Projects</h1>
    <!--h1 to h6 : heading tags , h1 is the largest-->
    <div style="background-color: green">Projexts</div>
    <!--Lets u add stuff in seprate line , else everything will be in one line-->
    <div style="background-color: red">have made alot of projects</div>

    <!--    B,I, U tages   -->
    <p>This is <b>bold</b> text.</p>
    <p>This is <i>italic</i> text.</p>
    <p>This is <u>underlined</u> text.</p>
    <!--A tags-->
    <a href="https://www.google.com">Visit Google</a>

    <!-- image tag -->
    <h2>My Image</h2>
    <img
      src="https://www.example.com/image.jpg"
      alt="Description of Image"
      width="300"
      height="200"
    />
    <!-- src : source of image , alt : alternative text if image not loaded-->
    <!-- video tag -->
    <h2>My Video</h2>
    <video width="320" height="240" controls>
      <source src="https://www.example.com/video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <!-- input tag -->
    <h2>Input Example</h2>
    <input type="text" placeholder="Enter your name" />
    <input type="submit" value="Submit" />
    <!-- button tag -->
    <h2>Button Example</h2>
    <button onclick="alert('Button Clicked!')">Click Me</button>
    <!-- onclick : when button is clicked , do the action-->

    <!-- br tag : line break -->
    <h2>Line Break Example</h2>
    This is the first line.<br />
    This is the second line.
  </body>
</html>
